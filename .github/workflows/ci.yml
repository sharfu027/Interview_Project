name: InterviewOS Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Spring Boot 3.4 Tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start PostgreSQL Service
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE DATABASE interviewos OWNER postgres;"

      - name: Run Backend Unit & Integration Tests
        run: |
          cd backend
          mvn clean test --batch-mode

  ai-service-test:
    name: FastAPI AI Service Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies & Run Pytest
        run: |
          cd ai-service
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest tests -v

  frontend-build:
    name: Frontend Vite & TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Typecheck and Build
        run: |
          cd frontend
          npm run build
